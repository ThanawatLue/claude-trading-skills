# Copy to state/automation_config.yaml and adjust.
# Live broker execution is intentionally unsupported.

market: TH
db_path: state/market_cache.db
theses_dir: state/theses
output_dir: reports/daily-signal-pipeline

exposure:
  enabled: true
  reports_dir: reports

expectancy_calibration:
  enabled: true
  apply: false          # advisory only until sample >= min_closed
  min_closed: 20

auto_paper:
  enabled: true
  execute: false
  execution_mode: dry_run
  kill_switch: false
  require_dual_check: true
  require_regime_gate: true
  hold_style: overnight
  dual_check_bars: true
  min_score: 70
  max_new_positions: 2
  max_open_positions: 5
  account_size: 100000
  risk_per_trade_pct: 0.5
  max_position_pct: 10
  max_portfolio_heat_pct: 2
  dynamic_decision: true
  preserve_signal_plan: true
  regime_policy:
    NEW_ENTRY_ALLOWED:
      allow_open: true
      risk_scale: 1.0
    REDUCE_ONLY:
      allow_open: true
      risk_scale: 0.5
    CASH_PRIORITY:
      allow_open: false
      risk_scale: 0.0

paper_exit_rules:
  vcp-screener:
    take_profit_r: 1.5
    max_hold_days: 7
    time_stop_min_r: 0.5
    trail_after_r: 1.0
    trail_stop_r: 0.0
  thai-swing-dip:
    take_profit_r: 1.0
    max_hold_days: 2
    trail_after_r: 1.0
    trail_stop_r: 0.0
  thai-swing-momentum:
    take_profit_r: 1.0
    max_hold_days: 3
    trail_after_r: 1.0
    trail_stop_r: 0.0
