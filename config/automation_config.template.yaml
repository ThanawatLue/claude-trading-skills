# Copy to state/automation_config.yaml and adjust.
# Live broker execution is intentionally unsupported.
#
# Week-1 hardening (2026-08):
# - dip time-stop relaxed (4d / only if R <= -0.3)
# - fingerprint block for weak symbol/source histories
# - per-source quotas + higher dip min_score

market: TH
db_path: state/market_cache.db
theses_dir: state/theses
output_dir: reports/daily-signal-pipeline

exposure:
  enabled: true
  reports_dir: reports

expectancy_calibration:
  enabled: true
  apply: false          # advisory only until sample >= min_closed
  min_closed: 20

auto_paper:
  enabled: true
  execute: false
  execution_mode: dry_run
  kill_switch: false
  require_dual_check: true
  require_regime_gate: true
  hold_style: overnight
  dual_check_bars: true
  fingerprint_block: true
  fingerprint_min_closed: 2
  fingerprint_min_win_rate: 0.4
  fingerprint_max_avg_realized_r: -0.25
  min_score: 70
  max_new_positions: 2
  max_open_positions: 5
  account_size: 100000
  risk_per_trade_pct: 0.5
  max_position_pct: 10
  max_portfolio_heat_pct: 2
  dynamic_decision: true
  min_expected_net_r: 0.05
  preserve_signal_plan: true
  regime_policy:
    NEW_ENTRY_ALLOWED:
      allow_open: true
      risk_scale: 1.0
    REDUCE_ONLY:
      allow_open: true
      risk_scale: 0.5
    CASH_PRIORITY:
      allow_open: false
      risk_scale: 0.0
  source_rules:
    thai-swing-dip:
      min_score: 85
      max_new_per_run: 1
      max_open: 2
      target_r: 2.0
      stop_pct_cap: 3.0
      take_profit_r: 2.0
      max_hold_days: 10
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 4
      velocity_min_mfe_r: 0.3
    thai-swing-momentum:
      min_score: 80
      max_new_per_run: 1
      max_open: 2
      target_r: 2.0
      stop_pct_cap: 4.0
      take_profit_r: 2.0
      max_hold_days: 8
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 3
      velocity_min_mfe_r: 0.3
    vcp-screener:
      min_score: 75
      max_new_per_run: 1
      target_r: 2.0
      stop_pct_cap: 5.0
      take_profit_r: 2.0
      max_hold_days: 12
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 4
      velocity_min_mfe_r: 0.3

paper_exit_rules:
  thai-swing-dip:
    take_profit_r: 2.0
    max_hold_days: 10
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 4
    velocity_min_mfe_r: 0.3
  thai-swing-momentum:
    take_profit_r: 2.0
    max_hold_days: 8
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 3
    velocity_min_mfe_r: 0.3
  vcp-screener:
    take_profit_r: 2.0
    max_hold_days: 12
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 4
    velocity_min_mfe_r: 0.3
