market: TH
db_path: state/market_cache.db
theses_dir: state/theses
output_dir: reports/daily-signal-pipeline
exposure:
  enabled: true
  reports_dir: reports
expectancy_calibration:
  enabled: true
  apply: false
  min_closed: 20
auto_paper:
  enabled: true
  execute: true
  execution_mode: paper
  kill_switch: false
  require_dual_check: true
  require_regime_gate: true
  hold_style: overnight
  dual_check_bars: true
  fingerprint_block: true
  fingerprint_min_closed: 2
  fingerprint_min_win_rate: 0.4
  fingerprint_max_avg_realized_r: -0.25
  min_score: 80
  max_new_positions: 4
  max_open_positions: 4
  account_size: 30000
  risk_per_trade_pct: 1
  max_position_pct: 20
  max_portfolio_heat_pct: 3
  dynamic_decision: true
  min_expected_net_r: 0.05
  preserve_signal_plan: true
  regime_policy:
    NEW_ENTRY_ALLOWED:
      allow_open: true
      risk_scale: 1.0
    REDUCE_ONLY:
      allow_open: true
      risk_scale: 0.5
    CASH_PRIORITY:
      allow_open: false
      risk_scale: 0.0
  source_rules:
    thai-swing-dip:
      min_score: 85
      max_new_per_run: 1
      max_open: 2
      target_r: 2.0
      stop_pct_cap: 2.5
      take_profit_r: 2.0
      max_hold_days: 10
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 4
      velocity_min_mfe_r: 0.3
      max_age_days: 1
    thai-swing-momentum:
      min_score: 80
      max_new_per_run: 1
      max_open: 2
      target_r: 2.0
      stop_pct_cap: 4.0
      take_profit_r: 2.0
      max_hold_days: 8
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 3
      velocity_min_mfe_r: 0.3
      max_age_days: 0
    vcp-screener:
      min_score: 75
      max_new_per_run: 1
      target_r: 2.0
      stop_pct_cap: 5.0
      take_profit_r: 2.0
      max_hold_days: 12
      time_stop_min_r: -0.5
      trail_after_r: 1.0
      trail_stop_r: 0.5
      ratchet_tiers:
        - [0.8, -0.3]
        - [1.2, 0.15]
        - [1.8, 0.8]
      velocity_stall_days: 4
      velocity_min_mfe_r: 0.3
  real_money_enabled: false
  max_age_days: 2
  high_score_override_min: 90
  max_open_positions_with_override: 4
  shares: 100
  derive_missing_risk: true
  default_stop_pct: 8
  target_r: 2
  min_confirmation_score: 0.6
  cooldown_after_loss_days: 2
  fee_model:
    broker: innovestx
    commission_pct: 0.15
    trading_fee_pct: 0.005
    clearing_fee_pct: 0.001
    vat_pct: 7
    slippage_bps: 5
  board_lot_size: 100
paper_exit_rules:
  thai-swing-dip:
    take_profit_r: 2.0
    max_hold_days: 10
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 4
    velocity_min_mfe_r: 0.3
  thai-swing-momentum:
    take_profit_r: 2.0
    max_hold_days: 8
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 3
    velocity_min_mfe_r: 0.3
  vcp-screener:
    take_profit_r: 2.0
    max_hold_days: 12
    time_stop_min_r: -0.5
    trail_after_r: 1.0
    trail_stop_r: 0.5
    ratchet_tiers:
      - [0.8, -0.3]
      - [1.2, 0.15]
      - [1.8, 0.8]
    velocity_stall_days: 4
    velocity_min_mfe_r: 0.3
signal_files:
  enabled: true
  patterns:
  - state/signals/*.json
  - state/signals/*.yaml
  - reports/vcp_screener_*.json
  - reports/canslim_screener_*.json
  - reports/thai_swing_*.json
  max_files_per_pattern: 3
horizons:
- 5
- 20
- 60
analysis:
  enabled: false
  url: http://127.0.0.1:5050/api/run
  timeout_seconds: 900
